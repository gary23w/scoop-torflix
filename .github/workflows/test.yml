name: Install test

# Installs Torflix from this bucket on x64 and arm64 Windows, starts it in its self-test
# (stopped once the window is up), then removes it.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Install Scoop
        run: |
          Invoke-RestMethod get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          Add-Content $env:GITHUB_PATH "$HOME\scoop\shims"
      - name: Install Torflix from this commit's manifest
        run: |
          scoop install "$env:GITHUB_WORKSPACE\bucket\torflix.json"
          if ($LASTEXITCODE) { throw "scoop install exited with $LASTEXITCODE" }
      - name: Start it
        env:
          TORRENTPLAYER_SMOKE_STEPS: ready
        run: |
          $exe = "$HOME\scoop\apps\torflix\current\Torflix.exe"
          $env:TORRENTPLAYER_SMOKE_OUT = "$env:RUNNER_TEMP\shots"
          $p = Start-Process $exe -ArgumentList '--smoke' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill($true); throw 'Torflix did not finish its self-test in 3 minutes' }
          if ($p.ExitCode -and (Test-Path $env:TORRENTPLAYER_SMOKE_OUT)) { throw "Torflix exited with $($p.ExitCode)" }
          if ($p.ExitCode) {
            # A build older than TORRENTPLAYER_SMOKE_OUT (it makes that folder first) cannot run
            # its self-test once installed; it has to stay up after a plain start instead.
            'Self-test unavailable in this build; a plain start must stay up 25 s'
            $p = Start-Process $exe -PassThru
            $null = $p.Handle
            if ($p.WaitForExit(25000)) { throw "Torflix exited with $($p.ExitCode) within 25 s" }
            Get-Process Torflix -ErrorAction SilentlyContinue | Stop-Process -Force
            'Still running after 25 s'
          }
      - name: Remove it
        run: |
          scoop uninstall torflix
          if ($LASTEXITCODE) { throw "scoop uninstall exited with $LASTEXITCODE" }
